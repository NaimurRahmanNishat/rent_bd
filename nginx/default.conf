# nginx/default.config
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream frontend {
    server frontend:3000;
}

upstream backend {
    least_conn;

    server backend1:8000 max_fails=3 fail_timeout=10s;
    server backend2:8000 max_fails=3 fail_timeout=10s;
    server backend3:8000 max_fails=3 fail_timeout=10s;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name rentbd.tech www.rentbd.tech 189.72.181.127 _;
    return 301 https://rentbd.tech$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name rentbd.tech www.rentbd.tech;

    ssl_certificate /etc/letsencrypt/live/rentbd.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentbd.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Django static files
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        expires 7d;
    }

    # Django API
    location /api/ {
        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
